update(){if(!this.alive)return;if(this.isYou){let s=keys.Shift?7:4;if(keys.w)this.y-=s;if(keys.s)this.y+=s;if(keys.a)this.x-=s;if(keys.d)this.x+=s;this.x=Math.max(20,Math.min(MAP-20,this.x));this.y=Math.max(20,Math.min(MAP-20,this.y));for(let l of loots){if(l.coll)continue;if(Math.hypot(l.x-this.x,l.y-this.y)<30){l.coll=true;l.resp=700;if(!unlockedW.has(l.wId)){unlockedW.add(l.wId);wL[l.wId]=1;showPop(`NEU BEHALTEN: ${getWeapons()[l.wId].name} [${TIERS[getWeapons()[l.wId].tier].name}]`)}eqW=l.wId;saveG();updHUD();coins+=50}}}else{if(Math.random()<0.02){this.tx=Math.random()*MAP;this.ty=Math.random()*MAP}let dx=this.tx-this.x,dy=this.ty-this.y,d=Math.hypot(dx,dy);if(d>5){this.x+=dx/d*2.6;this.y+=dy/d*2.6}let near=null,nd=600;for(let p of players){if(p===this||!p.alive)continue;let dd=Math.hypot(p.x-this.x,p.y-this.y);if(dd<nd){nd=dd;near=p}}if(near&&this.cd<=0){let ang=Math.atan2(near.y-this.y,near.x-this.x);let w=getWeapons()[this.weapon];bullets.push({x:this.x,y:this.y,vx:Math.cos(ang)*12,vy:Math.sin(ang)*12,owner:this,dmg:w.dmg*(1+this.tier*0.1),color:TIERS[this.tier].c,icon:w.icon,family:familyMode});this.cd=w.fire}if(this.cd>0)this.cd--}if(this.flash>0)this.flash--;for(let b of bullets){if(b.owner===this)continue;if(Math.hypot(b.x-this.x,b.y-this.y)<24){this.flash=10;let dmg=b.dmg;if(this.shield>0){let sd=Math.min(this.shield,dmg);this.shield-=sd;dmg-=sd}if(dmg>0)this.hp-=dmg*0.5;bullets.splice(bullets.indexOf(b),1);particles.push({x:this.x,y:this.y-10,life:12,icon:b.family?"🫧":`${Math.floor(b.dmg)}`});if(this.hp<=0){this.alive=false;for(let k=0;k<20;k++)particles.push({x:this.x,y:this.y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10-2,life:35,icon:familyMode?["✨","🎈","🌈","💫"][Math.floor(Math.random()*4)]:"✨"});loots.push({x:this.x,y:this.y,wId:this.weapon,tier:getWeapons()[this.weapon].tier,coll:false,resp:900});b.owner.kills++;if(b.owner.isYou){kills++;coins+=40+this.tier*40;saveG();updHUD()}}}}}
draw(){if(!this.alive)return;let skin=this.isYou?SKINS[eqS]:SKINS[this.skin]||SKINS[0];let col=TIERS[this.tier].c;if(skin.type==="rainbow"||skin.type==="godskin")col=`hsl(${(Date.now()/10)%360},100%,60%)`;else if(skin.type!=="default")col=skin.c;ctx.save();ctx.translate(this.x,this.y);if(this.flash>0)ctx.globalAlpha=0.6;if(familyMode){ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.font="18px serif";ctx.textAlign="center";ctx.fillText("🙂",0,6)}else{if(skin.type==="default"){ctx.fillStyle=col;ctx.fillRect(-10,-5,20,15);ctx.fillStyle="#ffdbac";ctx.beginPath();ctx.arc(0,-12,9,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.fillRect(-11,-21,22,6)}else if(skin.type==="knight"){ctx.fillStyle="#888";ctx.fillRect(-12,-6,24,18);ctx.fillStyle="#ccc";ctx.beginPath();ctx.arc(0,-14,11,0,Math.PI*2);ctx.fill();ctx.fillStyle="#555";ctx.fillRect(-13,-24,26,10)}else if(skin.type==="samurai"){ctx.fillStyle="#a00";ctx.fillRect(-11,-5,22,16);ctx.fillStyle="#ffdbac";ctx.beginPath();ctx.arc(0,-12,9,0,Math.PI*2);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.arc(0,-15,10,0,Math.PI);ctx.fill();ctx.fillStyle="#555";ctx.fillRect(8,-10,3,20)}else if(skin.type==="robot"){ctx.fillStyle=col;ctx.fillRect(-10,-5,20,15);ctx.fillStyle="#333";ctx.fillRect(-8,-18,16,12);ctx.fillStyle="#0f0";ctx.beginPath();ctx.arc(-3,-14,2,0,Math.PI*2);ctx.arc(3,-14,2,0,Math.PI*2);ctx.fill()}else if(skin.type==="angel"){ctx.fillStyle="#fff";ctx.fillRect(-10,-5,20,15);ctx.fillStyle="#ffdbac";ctx.beginPath();ctx.arc(0,-12,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(-12,0,8,0,Math.PI*2);ctx.arc(12,0,8,0,Math.PI*2);ctx.stroke();ctx.strokeStyle="#ff0";ctx.beginPath();ctx.arc(0,-24,7,0,Math.PI*2);ctx.stroke()}else if(skin.type==="demon"){ctx.fillStyle="#400";ctx.fillRect(-10,-5,20,15);ctx.fillStyle="#f88";ctx.beginPath();ctx.arc(0,-12,9,0,Math.PI*2);ctx.fill();ctx.fillStyle="#000";ctx.beginPath();ctx.moveTo(-8,-22);ctx.lineTo(-12,-28);ctx.lineTo(-4,-20);ctx.fill();ctx.beginPath();ctx.moveTo(8,-22);ctx.lineTo(12,-28);ctx.lineTo(4,-20);ctx.fill()}else{ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=12;ctx.fillRect(-10,-5,20,15);ctx.shadowBlur=0;ctx.fillStyle="#ffdbac";ctx.beginPath();ctx.arc(0,-12,9,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.fillRect(-11,-21,22,6)}}}ctx.restore();ctx.fillStyle="#000";ctx.fillRect(this.x-22,this.y-34,44,4);ctx.fillStyle=col;ctx.fillRect(this.x-22,this.y-34,44*this.shield/this.maxS,4);ctx.fillStyle="#000";ctx.fillRect(this.x-22,this.y-28,44,4);ctx.fillStyle=familyMode?"#ff88ff":"#0f0";ctx.fillRect(this.x-22,this.y-28,44*this.hp/this.maxH,4);if(this.isYou){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.strokeRect(this.x-22,this.y-22,44,30)}}}
spawnL();for(let i=0;i<100;i++)players.push(new P(i,i==99));let you=players.find(p=>p.isYou);c.style.background=familyMode?"#2a1040":"#1a2040";
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('mousemove',e=>{mouse.x=e.clientX+cam.x;mouse.y=e.clientY-82+cam.y});c.addEventListener('mousedown',()=>mouse.down=true);c.addEventListener('mouseup',()=>mouse.down=false);
function showPop(t){let el=document.createElement('div');el.style.cssText='position:fixed;top:90px;left:50%;transform:translateX(-50%);background:'+(familyMode?'#ff88ff':'#ffcc00')+';color:#000;padding:6px 12px;font-weight:bold;z-index:50;border-radius:15px;font-size:10px';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2000)}
function toggleShop(){let el=document.getElementById('shopPanel');el.style.display=el.style.display==='none'||!el.style.display?'block':'none';if(el.style.display==='block')renderTab()}function switchTab(t){curTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');renderTab()}
function renderTab(){let cont=document.getElementById('shopContent');let WEAPONS=getWeapons();if(curTab==='box'){cont.innerHTML=`<div class="boxGrid">`+BOXES.map((b,i)=>`<div class="boxCard" style="border-color:${TIERS[i].c}"><div style="font-size:26px">${b.icon}</div><div>${b.name}</div><div style="font-size:8px;color:${TIERS[i].c}">${TIERS[i].name} - 60% Kämpfer 30% Waffe 10% Skin</div><div>💰 ${b.price}</div><button onclick="buyBox(${i})">KAUFEN</button></div>`).join('')+`</div>`}else if(curTab==='fighter'){cont.innerHTML=TIERS.map((r,t)=>`<div style="margin:8px 0"><b style="color:${r.c}">${r.i} ${r.name} - ${r.p}💰</b><br><div class="boxGrid">`+FIGHTERS.filter(f=>f.tier===t).map(f=>{let have=unlockedF.has(f.id);return `<div class="boxCard" style="border-color:${r.c};opacity:${have?0.5:1}"><div style="font-size:9px;color:${r.c};font-weight:bold">${f.name}</div><div>💰 ${r.p}</div>${have?`<button onclick="equipF(${f.id})">USE</button>`:`<button onclick="buyF(${f.id})">KAUFEN</button>`}</div>`}).join('')+`</div></div>`).join('')}else if(curTab==='weapon'){cont.innerHTML=TIERS.map((r,t)=>{let list=WEAPONS.filter(w=>w.tier===t);let chance=[25,20,17,13,10,6,4,3,1.3,0.7][t];return `<div style="margin:8px 0"><b style="color:${r.c}">${r.i} ${r.name} ${familyMode?"Spielzeug":"Waffen"} - ${r.p*2}💰 - Map ${chance}% - ${familyMode?"FAMILY":"NORMAL"}</b><br><div class="boxGrid">`+list.map(w=>{let idx=WEAPONS.indexOf(w);let have=unlockedW.has(idx);return `<div class="boxCard" style="border-color:${r.c};opacity:${have?0.5:1}"><div style="font-size:9px;color:${r.c};font-weight:bold">${w.icon} ${w.name}</div><div>DMG ${w.dmg}</div><div>💰 ${r.p*2}</div>${have?`<button onclick="equipW(${idx})">USE</button>`:`<button onclick="buyW(${idx})">KAUFEN</button>`}</div>`}).join('')+`</div></div>`}).join('')}else{cont.innerHTML=`<div style="text-align:center">🎨 20 SKINS = neues Aussehen! NUR aus Boxen!</div><div class="boxGrid">`+SKINS.map((s,i)=>{let have=unlockedS.has(i);let price=TIERS[Math.floor(i/2)].p;return `<div class="boxCard" style="border-color:${s.c};opacity:${have?1:0.6}"><div style="font-size:20px">${i==1?'🛡️':i==2?'🥷':i==3?'🤖':i==4?'🦖':i==9?'😇':i==10?'😈':'🎨'}</div><div style="color:${s.c};font-weight:bold">${s.name}</div><div style="font-size:8px">${s.desc}</div><div>💰 ${price}</div>${have?`<button onclick="equipS(${i})" style="background:${eqS==i?'#0f0':'#00f0ff'}">${eqS==i?'AKTIV':'USE'}</button>`:`<button onclick="buyS(${i})">KAUFEN</button>`}</div>`}).join('')+`</div>`}}
function buyF(id){let p=TIERS[FIGHTERS[id].tier].p;if(coins<p||unlockedF.has(id))return;coins-=p;unlockedF.add(id);fL[id]=1;saveG();updHUD()}function buyW(id){let p=TIERS[getWeapons()[id].tier].p*2;if(coins<p||unlockedW.has(id))return;coins-=p;unlockedW.add(id);wL[id]=1;saveG();updHUD()}function buyS(id){let p=TIERS[Math.floor(id/2)].p;if(coins<p||unlockedS.has(id))return;coins-=p;unlockedS.add(id);sL[id]=1;saveG();updHUD();showPop(`NEUER LOOK: ${SKINS[id].name}!`)}
let pend=null;function buyBox(i){let b=BOXES[i];if(coins<b.price)return;coins-=b.price;saveG();updHUD();let r=Math.random(),cum=0,tier=0;for(let j=0;j<10;j++){cum+=b.chances[j];if(r<=cum){tier=j;break}}let roll=Math.random();let WEAPONS=getWeapons();if(roll<0.4){let pool=FIGHTERS.filter(f=>f.tier===tier);pend={type:'fighter',obj:pool[Math.floor(Math.random()*pool.length)]}}else if(roll<0.75){let pool=WEAPONS.filter(w=>w.tier===tier);pend={type:'weapon',obj:pool[Math.floor(Math.random()*pool.length)]}}else{let pool=SKINS.filter((s,idx)=>Math.floor(idx/2)===tier);pend={type:'skin',obj:pool[Math.floor(Math.random()*pool.length)]}}document.getElementById('boxModal').style.display='flex';document.getElementById('boxTitle').textContent=b.name+" - "+(familyMode?"FAMILY":"NORMAL");document.getElementById('boxAnim').textContent=b.icon;document.getElementById('boxAnim').style.display='block';document.getElementById('boxResult').innerHTML='Klick zum Öffnen!';document.getElementById('closeBox').style.display='none'}
function openBox(){document.getElementById('boxAnim').textContent='💥';setTimeout(()=>{document.getElementById('boxAnim').style.display='none';let res=document.getElementById('boxResult');let WEAPONS=getWeapons();if(pend.type==='fighter'){let f=pend.obj;let r=TIERS[f.tier];let isNew=!unlockedF.has(f.id);if(isNew){unlockedF.add(f.id);fL[f.id]=1}else coins+=Math.floor(r.p*0.4);res.innerHTML=`${isNew?'🎉 NEUER KÄMPFER':'♻️ Duplikat'}<br><span style="color:${r.c};font-size:18px">${r.i} ${f.name}</span><br><button onclick="equipF(${f.id})">Ausrüsten</button>`}else if(pend.type==='weapon'){let w=pend.obj;let r=TIERS[w.tier];let idx=WEAPONS.indexOf(w);let isNew=!unlockedW.has(idx);if(isNew){unlockedW.add(idx);wL[idx]=1}else coins+=Math.floor(r.p*0.8);res.innerHTML=`${isNew?'🎉 NEUE ${familyMode?"SPIELZEUG":"WAFFE"}':'♻️ Duplikat'}<br><span style="color:${r.c};font-size:18px">${r.i} ${w.icon} ${w.name} [${r.name}]</span><br><button onclick="equipW(${idx})">Ausrüsten</button>`}else{let s=pend.obj;let idx=SKINS.indexOf(s);let r=TIERS[Math.floor(idx/2)];let isNew=!unlockedS.has(idx);if(isNew){unlockedS.add(idx);sL[idx]=1}else coins+=Math.floor(r.p*0.5);res.innerHTML=`${isNew?'🎉 NEUER SKIN':'♻️ Duplikat'}<br><span style="color:${s.c};font-size:18px">🎨 ${s.name}<br>${s.desc}</span><br><button onclick="equipS(${idx})">Anziehen!</button>`}saveG();updHUD();document.getElementById('closeBox').style.display='inline-block'},400)}
function closeBox(){document.getElementById('boxModal').style.display='none'}function equipF(id){eqF=id;saveG();location.reload()}function equipW(id){eqW=id;saveG();updHUD()}function equipS(id){eqS=id;saveG();updHUD();showPop(`Look: ${SKINS[id].name} aktiv!`)}
function showCollection(){document.getElementById('collection').style.display='flex';document.getElementById('colF').innerHTML='<h3>🥷 100 KÄMPFER</h3>'+TIERS.map((r,t)=>{let list=FIGHTERS.filter(f=>f.tier===t);let own=list.filter(f=>unlockedF.has(f.id)).length;return `<div style="margin:6px 0"><b style="color:${r.c}">${r.i} ${r.name} (${own}/10)</b><br>`+list.map(f=>{if(!unlockedF.has(f.id))return `<span style="opacity:.3;font-size:8px;margin:2px">🔒 ${f.name}</span>`;return `<span style="display:inline-block;margin:2px;padding:3px;border:1px solid ${r.c};font-size:8px">${f.name}</span>`}).join('')+`</div>`}).join('');let WEAPONS=getWeapons();document.getElementById('colW').innerHTML=`<h3>${familyMode?"🫧 100 SPIELZEUG (FAMILY)":"🔫 100 WAFFEN (NORMAL)"} - Aktueller Modus: ${familyMode?"FAMILY":"NORMAL"} - Andere Waffen bleiben gespeichert!</h3>`+TIERS.map((r,t)=>{let list=WEAPONS.filter(w=>w.tier===t);let own=list.filter(w=>unlockedW.has(WEAPONS.indexOf(w))).length;return `<div style="margin:6px 0"><b style="color:${r.c}">${r.i} ${r.name} (${own}/10) Map ${[25,20,17,13,10,6,4,3,1.3,0.7][t]}%</b><br>`+list.map(w=>{let idx=WEAPONS.indexOf(w);if(!unlockedW.has(idx))return `<span style="opacity:.3;font-size:8px;margin:2px">🔒 ${w.name}</span>`;return `<span style="display:inline-block;margin:2px;padding:3px;border:1px solid ${r.c};font-size:8px">${w.icon} ${w.name}</span>`}).join('')+`</div>`}).join('');document.getElementById('colS').innerHTML='<h3>🎨 20 SKINS neues Aussehen - NUR BOXEN!</h3><div class="boxGrid">'+SKINS.map((s,i)=>{if(!unlockedS.has(i))return `<div style="opacity:.3;border:1px solid #333;padding:5px">🔒 ${s.name}</div>`;return `<div style="border:2px solid ${s.c};padding:5px;background:#111"><b style="color:${s.c}">${s.name}</b><br><span style="font-size:8px">${s.desc}</span><br><button onclick="equipS(${i})" style="background:${eqS==i?'#0f0':'#00f0ff'}">${eqS==i?'AKTIV':'USE'}</button></div>`}).join('')+'</div>'}
function loop(){ctx.fillStyle=familyMode?"#2a1040":"#1a2040";ctx.fillRect(0,0,c.width,c.height);cam.x=you.x-c.width/2;cam.y=you.y-c.height/2;cam.x=Math.max(0,Math.min(MAP-c.width,cam.x));cam.y=Math.max(0,Math.min(MAP-c.height,cam.y));for(let l of loots){if(l.coll){l.resp--;if(l.resp<=0){l.coll=false;l.x=Math.random()*MAP;l.y=Math.random()*MAP}continue}let r=TIERS[l.tier];ctx.save();ctx.translate(l.x-cam.x,l.y-cam.y);ctx.fillStyle=r.c;ctx.shadowColor=r.c;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.font="14px serif";ctx.textAlign="center";ctx.fillText(getWeapons()[l.wId].icon,0,4);ctx.strokeStyle=r.c;ctx.lineWidth=2;ctx.strokeRect(-16,-16,32,32);if(l.tier>=7){ctx.fillStyle=r.c;ctx.font="7px monospace";ctx.fillText(r.name.toUpperCase(),0,24)}ctx.restore()}for(let p of players)p.update();let WEAPONS=getWeapons();let w=WEAPONS[eqW];if(mouse.down&&cd<=0&&you.alive){let ang=Math.atan2(mouse.y-you.y,mouse.x-you.x);bullets.push({x:you.x,y:you.y,vx:Math.cos(ang)*(familyMode?11:13),vy:Math.sin(ang)*(familyMode?11:13),owner:you,dmg:w.dmg*mult(wL,eqW)*mult(fL,eqF),color:TIERS[FIGHTERS[eqF].tier].c,icon:w.icon,family:familyMode});cd=w.fire}if(cd>0)cd--;for(let b of bullets){b.x+=b.vx;b.y+=b.vy;if(b.family){ctx.font="14px serif";ctx.fillText(b.icon,b.x-cam.x,b.y-cam.y)}else{ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x-cam.x,b.y-cam.y,5,0,Math.PI*2);ctx.fill()}if(b.x<0||b.x>MAP||b.y<0||b.y>MAP)bullets.splice(bullets.indexOf(b),1)}for(let pa of particles){pa.x+=pa.vx||0;pa.y+=pa.vy||0;pa.life--;ctx.font="14px serif";ctx.fillText(pa.icon,pa.x-cam.x,pa.y-cam.y);if(pa.life<=0)particles.splice(particles.indexOf(pa),1)}for(let p of players){ctx.save();ctx.translate(-cam.x,-cam.y);p.draw();ctx.restore()}let alive=players.filter(p=>p.alive).length;document.getElementById('alive').textContent=`${alive}/100 K:${kills} ${familyMode?"🧸":"🔫"}`;document.getElementById('roster').innerHTML=players.slice().sort((a,b)=>b.kills-a.kills).slice(0,22).map(p=>{let r=TIERS[FIGHTERS[p.i].tier];return `<div style="color:${r.c}">${p.alive?'●':(familyMode?'💫':'✨')} ${FIGHTERS[p.i].name}</div>`}).join('');mctx.fillStyle="#000";mctx.fillRect(0,0,116,116);for(let l of loots){if(l.coll)continue;mctx.fillStyle=TIERS[l.tier].c;mctx.fillRect(l.x/MAP*116,l.y/MAP*116,l.tier>=8?4:2,l.tier>=8?4:2)}for(let p of players){if(!p.alive)continue;mctx.fillStyle=p===you?"#fff":TIERS[FIGHTERS[p.i].tier].c;mctx.fillRect(p.x/MAP*116,p.y/MAP*116,p===you?5:2,p===you?5:2)}if(!you.alive){ctx.fillStyle="#000a";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle=familyMode?"#ff88ff":"#fc0";ctx.font="22px monospace";ctx.fillText(familyMode?"PUFF! 💫 Du bist raus!":"ELIMINIERT ✨",c.width/2-120,c.height/2);return}if(alive===1&&you.alive){ctx.fillStyle="#000a";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle=familyMode?"#ff88ff":"#0f8";ctx.font="22px monospace";ctx.fillText(familyMode?"FAMILY SIEG! 🎉👑":"SIEG ROYALE 👑",c.width/2-110,c.height/2);return}requestAnimationFrame(loop)}updHUD();loop();
