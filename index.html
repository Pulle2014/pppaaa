<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>FIXED</title>
<style>body{margin:0;background:#111;color:#fff;font-family:Arial}#hud{background:#222;padding:10px;border-bottom:2px solid cyan}canvas{background:#111;width:100%;height:90vh;display:block}#ok{background:green;padding:10px;text-align:center}</style>
</head><body>
<div id="hud"><button>SHOP</button><button>SKINS</button><button>ULTIMATES</button></div>
<div id="ok">REPARATUR ERFOLGREICH - Jetzt ohne Emoji!</div>
<canvas id="g"></canvas>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');c.width=innerWidth;c.height=600;let px=100,py=100;
function d(){x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);x.fillStyle='cyan';x.fillRect(px,py,40,40);requestAnimationFrame(d);}
addEventListener('keydown',e=>{if(e.key=='w')py-=10;if(e.key=='s')py+=10;if(e.key=='a')px-=10;if(e.key=='d')px+=10;});d();
</script></body></html>
