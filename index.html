<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ROBOT-NITE - Fortnite mit Robotern</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a14;color:#fff;font-family:Arial;overflow:hidden}#ui{position:fixed;inset:0;pointer-events:none;z-index:100}#hudTop{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(#1a1a3a,#0e0e20);border-bottom:3px solid #00e5ff;display:flex;align-items:center;padding:0 12px;gap:8px;pointer-events:auto}#hudTop button{background:#222;border:2px solid #00e5ff;color:#fff;padding:7px 12px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:11px}#hudTop button:hover{background:#00e5ff;color:#000}#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px}#center::before,#center::after{content:'';position:absolute;background:#fff}#center::before{width:2px;height:16px;left:7px;top:0;opacity:.7}#center::after{width:16px;height:2px;left:0;top:7px;opacity:.7}#bottomBar{position:absolute;bottom:0;left:0;right:0;height:88px;background:linear-gradient(transparent,#000);display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:10px}#slot{width:68px;height:68px;background:#1e1e2e;border:2px solid #555;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px}#slot.active{border-color:#ffcc00;box-shadow:0 0 12px #ffcc00}#hpBar{position:absolute;bottom:100px;left:20px;width:220px;height:22px;background:#000;border:2px solid #00e5ff;border-radius:11px;overflow:hidden}#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#0f8,#0a0);transition:width.2s}#stormInfo{position:absolute;top:70px;right:20px;background:rgba(128,0,255,.8);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:bold}#map{position:absolute;top:70px;left:20px;width:130px;height:130px;background:rgba(0,0,0,.7);border:2px solid #fff;border-radius:50%;overflow:hidden}.panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#141432;border:3px solid #00e5ff;border-radius:16px;padding:20px;width:90%;max-width:500px;display:none;pointer-events:auto;z-index:200}.panel.active{display:block}.btnBig{width:100%;padding:14px;background:#ffcc00;color:#000;border:none;border-radius:10px;font-size:20px;font-weight:bold;cursor:pointer;margin-top:10px}.mode{padding:18px;background:#1e1e3e;border:3px solid #444;border-radius:12px;margin-bottom:10px;cursor:pointer;text-align:center;font-size:18px}.mode:hover{border-color:#00e5ff}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body>
<div id="ui">
  <div id="hudTop"><button onclick="openLobby()">LOBBY</button><button onclick="build('wall')">WAND [1]</button><button onclick="build('floor')">BODEN [2]</button><button onclick="build('ramp')">RAMPE [3]</button><div style="margin-left:auto;display:flex;gap:10px;font-weight:bold"><div>HP <span id="hpT" style="color:#0f8">100</span></div><div>MAT <span id="matT" style="color:#ffcc00">500</span></div><div>KILLS <span id="killT">0</span></div><div>ALIVE <span id="aliveT">23</span></div></div></div>
  <div id="center"></div><div id="hpBar"><div id="hpFill"></div></div><div id="stormInfo">STURM IN: <span id="stormTimer">60</span>s</div>
  <div id="map"><canvas id="mini" width="130" height="130"></canvas></div>
  <div id="bottomBar"><div class="slot active" id="s0">PISTOL</div><div class="slot" id="s1">SHOTGUN</div><div class="slot" id="s2">AR</div><div class="slot" id="s3">ROCKET</div><div class="slot" id="s4">MEDKIT</div></div>
</div>

<div id="lobbyPanel" class="panel active"><h1 style="text-align:center;color:#00e5ff">ROBOT-NITE</h1><p style="text-align:center;color:#aaa;font-size:12px">FORTNITE mit ROBOTERN - Nach deinen Skizzen</p>
<div style="display:flex;gap:12px;margin-top:16px"><div style="flex:1"><button class="btnBig" style="background:#222;color:#fff;border:2px solid #00e5ff" onclick="openShop()">AUSRÜSTUNG</button><button class="btnBig" style="background:#222;color:#fff;border:2px solid #00e5ff;margin-top:8px" onclick="openShop()">SHOP</button></div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e1e2e;border-radius:12px;padding:10px;border:2px solid #00e5ff"><div style="font-size:10px;color:#888">(Ausgewählter Roboter)</div><div id="lobbyBot" style="width:80px;height:100px;background:linear-gradient(#777,cyan);border-radius:10px;margin:6px;box-shadow:0 0 15px cyan"></div><div id="lobbyName" style="color:cyan;font-weight:bold">CYAN-BOT</div></div></div>
<button class="btnBig" onclick="openPlay()">PLAY</button></div>

<div id="playPanel" class="panel"><h2>MODUS WÄHLEN</h2><div style="display:flex;gap:12px;margin-top:12px"><div style="flex:1"><div class="mode" onclick="selectMode('kronen')"><br>Kronenjagd<br><small>10 Kronen sammeln</small></div><div class="mode" onclick="selectMode('showdown')"><br>Showdown<br><small>Letzter überlebt</small></div></div><div style="width:90px;display:flex;flex-direction:column;gap:8px"><button id="bSolo" style="padding:10px;border:3px solid #ffcc00;background:#222;color:#fff;border-radius:8px;font-weight:bold" onclick="setTeam('solo')">Solo</button><button id="bDuo" style="padding:10px;border:2px solid #00e5ff;background:#222;color:#fff;border-radius:8px" onclick="setTeam('duo')">Duo</button><button id="bTrio" style="padding:10px;border:2px solid #00e5ff;background:#222;color:#fff;border-radius:8px" onclick="setTeam('trio')">Trio</button></div></div><button class="btnBig" onclick="startBattle()">BATTLE BUS STARTEN!</button><button style="width:100%;margin-top:8px;padding:8px;background:#333;color:#fff;border:none;border-radius:8px" onclick="openLobby()">ZURÜCK</button></div>

<div id="shopPanel" class="panel"><h2>SHOP</h2><div style="display:flex;gap:10px;margin-top:10px"><div style="width:90px;display:flex;flex-direction:column;gap:6px"><button style="border:2px solid #ffcc00;padding:6px;background:#222;color:#fff;border-radius:6px">Skins</button><button style="padding:6px;background:#222;color:#fff;border:1px solid #444;border-radius:6px">Waffen</button><button style="padding:6px;background:#222;color:#fff;border:1px solid #444;border-radius:6px">Tanz</button></div><div id="shopGrid" style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px"></div></div><button style="width:100%;margin-top:10px;padding:8px;background:#333;color:#fff;border:none;border-radius:8px" onclick="openLobby()">LOBBY</button></div>

<div id="busPanel" class="panel"><h1 style="color:#ffcc00;text-align:center">BATTLE BUS</h1><p style="text-align:center">Drücke LEERTASTE zum Abspringen!</p><div style="width:100%;height:20px;background:#333;border-radius:10px;margin-top:12px;overflow:hidden"><div id="busProgress" style="height:100%;width:0%;background:#ffcc00"></div></div></div>

<script type="module">
import * as THREE from 'three';
let money=800,materials=500,hp=100,maxHp=100,team='solo',mode='kronen',kills=0,alive=23,inBus=false,busTime=0,stormRadius=100,stormCenter=new THREE.Vector3(0,0,0),canBuild=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,80,200);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,1));
const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(50,50,25);sun.castShadow=true;scene.add(sun);
// ground island
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x3a9d23}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// POIs
for(let i=0;i<8;i++){const house=new THREE.Mesh(new THREE.BoxGeometry(6,4,6),new THREE.MeshStandardMaterial({color:0x888888}));house.position.set((Math.random()-0.5)*120,2,(Math.random()-0.5)*120);house.castShadow=true;scene.add(house);}
// chests
let chests=[];for(let i=0;i<10;i++){const chest=new THREE.Mesh(new THREE.BoxGeometry(1,0.8,0.8),new THREE.MeshStandardMaterial({color:0xffcc00,emissive:0xffaa00,emissiveIntensity:0.5}));chest.position.set((Math.random()-0.5)*140,0.4,(Math.random()-0.5)*140);chest.castShadow=true;scene.add(chest);chests.push(chest);}

function createRobot(x,z,col=0x888888){
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.3,0.7),new THREE.MeshStandardMaterial({color:col,metalness:0.8,roughness:0.2}));b.position.y=1.3;b.castShadow=true;g.add(b);
 const h=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.6,0.6),new THREE.MeshStandardMaterial({color:0xcccccc}));h.position.y=2.4;g.add(h);
 const eye=new THREE.Mesh(new THREE.SphereGeometry(0.11,6,6),new THREE.MeshStandardMaterial({color:0xff0000,emissive:0xff0000,emissiveIntensity:3}));eye.position.set(-0.15,2.45,0.35);g.add(eye);
 const eye2=eye.clone();eye2.position.x=0.15;g.add(eye2);
 const arm=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.8,0.25),new THREE.MeshStandardMaterial({color:0x666666}));arm.position.set(-0.75,1.3,0);g.add(arm);
 const arm2=arm.clone();arm2.position.x=0.75;g.add(arm2);
 g.position.set(x,0,z);g.userData={hp:100,alive:true};scene.add(g);return g;
}
let player=createRobot(0,0,0x00e5ff);
let enemies=[];for(let i=0;i<8;i++)enemies.push(createRobot((Math.random()-0.5)*100,(Math.random()-0.5)*100,[0xff3333,0x00ff88,0xffcc00,0xaa88ff][i%4]));
let builds=[];let bullets=[];let keys={};let mouseDown=false;

function openLobby(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('lobbyPanel').classList.add('active');}
function openPlay(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('playPanel').classList.add('active');}
function openShop(){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('shopPanel').classList.add('active');renderShop();}
window.openLobby=openLobby;window.openPlay=openPlay;window.openShop=openShop;
window.setTeam=t=>{team=t;document.getElementById('bSolo').style.borderColor=t==='solo'?'#ffcc00':'#00e5ff';document.getElementById('bDuo').style.borderColor=t==='duo'?'#ffcc00':'#00e5ff';document.getElementById('bTrio').style.borderColor=t==='trio'?'#ffcc00':'#00e5ff';};
window.selectMode=m=>{mode=m;};
function renderShop(){const grid=document.getElementById('shopGrid');grid.innerHTML='';const items=[{n:'CYAN-BOT',c:'cyan',p:0},{n:'RED-BOT',c:'#f33',p:200},{n:'GOLD-BOT',c:'gold',p:500},{n:'STEEL-BOT',c:'#aaa',p:300}];items.forEach(it=>{const d=document.createElement('div');d.style.cssText='background:#1e1e2e;border:2px solid #444;border-radius:10px;padding:10px;text-align:center';d.innerHTML=`<div style="width:60px;height:60px;background:${it.c};margin:auto;border-radius:8px"></div><div style="margin-top:6px;font-weight:bold">${it.n}</div><div style="font-size:11px">${it.p}$</div><button style="margin-top:6px;background:#00e5ff;border:none;padding:4px 8px;border-radius:6px;font-weight:bold">SELECT</button>`;d.querySelector('button').onclick=()=>{document.getElementById('lobbyBot').style.background=`linear-gradient(#777,${it.c})`;document.getElementById('lobbyName').textContent=it.n;player.traverse(o=>{if(o.isMesh&&o.geometry.type==='BoxGeometry'){if(o.material.color)o.material.color.set(it.c);}});openLobby();};grid.appendChild(d);});}

window.startBattle=()=>{
 document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
 document.getElementById('busPanel').classList.add('active');
 inBus=true;busTime=0;player.position.set(0,40,0);player.visible=false;
};

window.build=type=>{
 if(materials<10)return;materials-=10;document.getElementById('matT').textContent=materials;
 const dir=new THREE.Vector3();camera.getWorldDirection(dir);const pos=player.position.clone().add(dir.clone().multiplyScalar(4));pos.y=0;
 let mesh;if(type==='wall'){mesh=new THREE.Mesh(new THREE.BoxGeometry(3,3,0.3),new THREE.MeshStandardMaterial({color:0x8d7a5a}));mesh.position.set(pos.x,1.5,pos.z);}else if(type==='floor'){mesh=new THREE.Mesh(new THREE.BoxGeometry(3,0.3,3),new THREE.MeshStandardMaterial({color:0x8d7a5a}));mesh.position.set(pos.x,0.5,pos.z);}else{mesh=new THREE.Mesh(new THREE.BoxGeometry(3,0.3,3),new THREE.MeshStandardMaterial({color:0x8d7a5a}));mesh.position.set(pos.x,1.5,pos.z);mesh.rotation.x=Math.PI/5;}
 mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);builds.push({mesh,life:60});
};

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '&&inBus){inBus=false;document.getElementById('busPanel').classList.remove('active');player.visible=true;player.position.y=0;keys[' '] = false;}if(e.key==='1')build('wall');if(e.key==='2')build('floor');if(e.key==='3')build('ramp');});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('mousedown',()=>{mouseDown=true;shoot();});addEventListener('mouseup',()=>mouseDown=false);
function shoot(){
 const b=new THREE.Mesh(new THREE.SphereGeometry(0.12),new THREE.MeshStandardMaterial({color:0xffcc00,emissive:0xffcc00,emissiveIntensity:2}));
 const dir=new THREE.Vector3();camera.getWorldDirection(dir);b.position.copy(player.position);b.position.y=1.4;b.position.add(dir.clone().multiplyScalar(1.5));
 b.userData={dir,life:80};scene.add(b);bullets.push(b);
}

let stormTime=60;setInterval(()=>{if(!inBus){stormTime--;document.getElementById('stormTimer').textContent=stormTime;if(stormTime<=0){stormRadius-=0.3;stormTime=60;if(stormRadius<10)stormRadius=10;}}},1000);

function loop(){
 requestAnimationFrame(loop);
 if(inBus){
  busTime+=0.02;document.getElementById('busProgress').style.width=(busTime*20)+'%';
  camera.position.set(Math.sin(busTime)*10,40+Math.sin(busTime*2)*2,Math.cos(busTime)*10);camera.lookAt(0,0,0);
  if(busTime>5){inBus=false;document.getElementById('busPanel').classList.remove('active');player.visible=true;player.position.set(0,0,0);}
  renderer.render(scene,camera);return;
 }
 if(!player.userData.alive){renderer.render(scene,camera);return;}
 let mx=0,mz=0;if(keys['w'])mz=-0.18;if(keys['s'])mz=0.18;if(keys['a'])mx=-0.18;if(keys['d'])mx=0.18;
 const camDir=new THREE.Vector3();camera.getWorldDirection(camDir);camDir.y=0;camDir.normalize();const right=new THREE.Vector3().crossVectors(camDir,new THREE.Vector3(0,1,0));
 player.position.add(camDir.multiplyScalar(-mz*4));player.position.add(right.multiplyScalar(-mx*4));
 player.position.x=Math.max(-95,Math.min(95,player.position.x));player.position.z=Math.max(-95,Math.min(95,player.position.z));
 // storm damage
 if(player.position.distanceTo(stormCenter)>stormRadius){hp-=0.2;document.getElementById('hpT').textContent=Math.floor(hp);document.getElementById('hpFill').style.width=(hp)+'%';if(hp<=0){hp=0;alert('IM STURM GESTORBEN!');location.reload();}}

 camera.position.lerp(player.position.clone().add(new THREE.Vector3(0,7,12)),0.1);camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1,0)));

 enemies.forEach(e=>{
  if(!e.userData.alive)return;
  const d=new THREE.Vector3().subVectors(player.position,e.position);d.y=0;if(d.length()<30){d.normalize();e.position.add(d.multiplyScalar(0.02));e.lookAt(player.position);}
  if(player.position.distanceTo(e.position)<2){hp-=0.2;}
 });

 bullets.forEach((b,i)=>{
  b.position.add(b.userData.dir.clone().multiplyScalar(1.2));b.userData.life--;if(b.userData.life<=0){scene.remove(b);bullets.splice(i,1);return;}
  enemies.forEach(en=>{if(en.userData.alive&&b.position.distanceTo(en.position.clone().add(new THREE.Vector3(0,1,0)))<1.5){en.userData.hp-=25;if(en.userData.hp<=0){en.userData.alive=false;scene.remove(en);kills++;alive--;document.getElementById('killT').textContent=kills;document.getElementById('aliveT').textContent=alive;materials+=50;document.getElementById('matT').textContent=materials;}scene.remove(b);bullets.splice(i,1);}});
 });

 // chests loot
 chests.forEach((c,i)=>{if(player.position.distanceTo(c.position)<2){scene.remove(c);chests.splice(i,1);materials+=100;document.getElementById('matT').textContent=materials;hp=Math.min(100,hp+20);}});

 document.getElementById('hpT').textContent=Math.floor(hp);document.getElementById('hpFill').style.width=hp+'%';
 if(alive<=1){alert('VICTORY ROYALE! Du bist der letzte Roboter!');location.reload();}

 // minimap
 const ctx=document.getElementById('mini').getContext('2d');ctx.clearRect(0,0,130,130);ctx.fillStyle='#3a9d23';ctx.fillRect(0,0,130,130);ctx.strokeStyle='purple';ctx.lineWidth=2;ctx.beginPath();ctx.arc(65+stormCenter.x*0.5,65+stormCenter.z*0.5,stormRadius*0.5,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#00e5ff';ctx.fillRect(65+player.position.x*0.5,65+player.position.z*0.5,4,4);enemies.forEach(en=>{if(en.userData.alive){ctx.fillStyle='red';ctx.fillRect(65+en.position.x*0.5,65+en.position.z*0.5,3,3);}});

 renderer.render(scene,camera);
}loop();
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};
setTeam('solo');
</script></body></html>
